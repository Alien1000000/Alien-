name: Build Android APK
# Alien News Android 2.0.4

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Test and build APK
        run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alien-News-2.0.4-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare release signing
        if: ${{ secrets.ALIEN_NEWS_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ALIEN_NEWS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ALIEN_NEWS_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ALIEN_NEWS_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          {
            echo "storeFile=release-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=aliennews"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: Build signed Play Store bundle
        if: ${{ secrets.ALIEN_NEWS_KEYSTORE_BASE64 != '' }}
        run: gradle bundleRelease --stacktrace
      - name: Upload signed AAB
        if: ${{ secrets.ALIEN_NEWS_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Alien-News-2.0.4-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
